<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neuro Engine · Embodied Learning Lab</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark"></span><div><strong>Neuro Engine</strong><small>Embodied Learning Lab · v1</small></div></div>
    <div class="status"><span id="acceptance-dot"></span><strong id="acceptance-label">载入实验</strong><span id="version"></span></div>
  </header>

  <main class="workspace">
    <section class="world-card card">
      <div class="section-head">
        <div><span class="eyebrow">BEHAVIOR IS THE OUTPUT</span><h1>二维生存环境</h1></div>
        <label>对照分支 <select id="trace-select"></select></label>
      </div>
      <div class="world-wrap">
        <canvas id="world" aria-label="主体在二维环境中的行为"></canvas>
        <div class="world-legend"><span><i class="agent-dot"></i>主体</span><span><i class="food-dot"></i>食物</span><span><i class="hazard-dot"></i>危险</span><span><i class="path-dot"></i>轨迹</span></div>
      </div>
      <div class="transport">
        <button id="prev" aria-label="后退一步">‹</button>
        <button id="play" class="primary" aria-label="播放">▶</button>
        <button id="next" aria-label="前进一步">›</button>
        <label>速度 <select id="speed"><option value="2">2×</option><option value="5">5×</option><option value="10" selected>10×</option><option value="20">20×</option><option value="40">40×</option></select></label>
        <strong id="step-label">step 0</strong>
        <input id="timeline" type="range" min="0" max="1" value="0" aria-label="行为时间线">
      </div>
    </section>

    <section class="state-column">
      <section class="vitals card">
        <div class="section-head compact"><div><span class="eyebrow">INTERNAL NEED</span><h2>主体状态</h2></div><strong id="action-name">—</strong></div>
        <div class="energy-row"><span>能量</span><div class="meter"><i id="energy-bar"></i></div><strong id="energy-value">—</strong></div>
        <div class="metric-grid"><div><span>已获取食物</span><strong id="food-value">—</strong></div><div><span>即时后果</span><strong id="reward-value">—</strong></div><div><span>位置</span><strong id="position-value">—</strong></div><div><span>方向</span><strong id="heading-value">—</strong></div></div>
      </section>

      <section class="card neural-state">
        <div class="section-head compact"><div><span class="eyebrow">SENSE → STATE → ACTION</span><h2>神经控制器</h2></div><span>12 感觉 · 24 内部 · 4 动作</span></div>
        <h3>动作概率</h3><div id="action-bars" class="bar-list"></div>
        <h3>感觉输入</h3><div id="sensor-bars" class="sensor-grid"></div>
        <h3>内部活动</h3><div id="hidden-grid" class="hidden-grid"></div>
      </section>
    </section>

    <section class="evidence card">
      <div class="section-head"><div><span class="eyebrow">HELD-OUT MAPS</span><h2>未见环境行为证据</h2></div><span id="evaluation-count"></span></div>
      <div id="evaluation-cards" class="evaluation-cards"></div>
      <div class="acceptance-grid" id="acceptance-grid"></div>
    </section>

    <section class="learning card">
      <div class="section-head"><div><span class="eyebrow">PERSISTENT CHANGE</span><h2>训练过程</h2></div><div id="plasticity-summary"></div></div>
      <canvas id="learning-curve" aria-label="训练期间获取食物变化"></canvas>
    </section>
  </main>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
